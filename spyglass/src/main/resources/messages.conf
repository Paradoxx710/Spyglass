# ==============================================================================
#                      Spyglass Messages Configuration
# ==============================================================================
# Config version - do not edit.
config-version = 1
#
# This file allows you to customize and translate all messages and styles in Spyglass.
#
# Syntax Guide:
#   - <tags>        : MiniMessage formatting (colors, gradients, hover, click, fonts).
#                     Examples: <green>, <aqua>, <#ff5555>, <bold>, <italic>,
#                               <hover:show_text:'Click here'><click:run_command:'/sg undo'>
#   - & codes       : Traditional ampersand formatting is also accepted, including
#                     colors (&0-&f), formatting (&l bold, &o italic, &n underline,
#                     &m strike, &k obfuscated, &r reset) and hex (&#ff5555 or
#                     &x&f&f&5&5&5&5). Use && for a literal ampersand.
#                     Both styles can be mixed in the same message.
#   - %placeholder% : Dynamic variables provided by Spyglass or PlaceholderAPI.
#                     Examples: %message%, %player%, %action%, %count%, %time%, %location%
#   - ${prefix}     : Inserts the configured global prefix into another message.
# ==============================================================================

# Global prefix used across feedback categories
prefix = "<green>«</green><aqua>Spyglass</aqua><green>»</green>"

feedback {
  # Message feedback categories
  error = "${prefix}<red> (Error) </red>%message%"
  info = "${prefix}%message%"
  warn = "${prefix}%message%"
  success = "${prefix}%message%"
  bonus = "%message%"
  querying = "<dark_aqua>Querying records...</dark_aqua>"
  tool-ok = "%message%"
  inspect-header = "${prefix}<green> --- </green>%target%<white> at </white>%location%<gray> (last %window%)</gray><green> ---</green>"
}

tool {
  # The inspector wand handed out by /sg tool. Both fields accept
  # MiniMessage tags and traditional & codes.
  name = "<gold><bold>Spyglass Wand</bold></gold>"

  # One line per entry; set to [] for no lore. Examples:
  # lore = ["<gray>Right-click a block to inspect its history.</gray>"]
  # lore = ["&7Right-click a block", "&7to inspect its history."]
  lore = []
}

commands {
  # Generic command feedback
  no-results = "No results."
  config-reloaded = "Spyglass configuration reloaded. Event toggles, retention, redaction and wand settings are active."
  config-reload-failed = "Spyglass could not reload config.conf; check the console."
  config-restart-required = "Spyglass: restart required for %changes%; no live settings were changed."
  no-permission = "<red>You do not have permission to execute this command.</red>"
  player-only = "You must be a player to use this command"
  teleporting = "Teleporting to %location%..."

  # Action-specific permissions
  action-no-permission = "You do not have permission to query the '%action%' action."
  action-rollback-no-permission = "You do not have permission to rollback the '%action%' action."

  # Rollback & Undo
  rollback-queued = "Rollback queued at position %position% (id %id%). View / cancel with /sg rbqueue."
  rollback-started = "Rollback %id% starting before the recorder drained: %detail%. The newest events may be missing from this rollback; re-run once the backlog clears (see /spyglass stats) to catch them."
  rollback-complete = "Rollback complete. Restored %count% blocks in %time%."
  rollback-failed = "Spyglass rollback job %id% failed: %message%"
  undo-complete = "Undo complete. Reverted %id% (%count% blocks restored)."
  no-rollback-in-flight = "No rollback in flight."

  # Tool
  tool-activated = "Added the Spyglass data tool to your inventory."
  tool-deactivated = "Deactivated the Spyglass Data Tool"
  tool-no-room = "Make room in your inventory for the Spyglass wand."

  # Pagination
  page-header = "<green>--- </green><aqua>Spyglass Search</aqua> (Page %page%/%total%)<green> ---</green>"
  page-invalid = "Invalid page number %page% (total pages: %total%)."
}

results {
  # Display tokens
  ip-hidden = "(ip hidden)"

  # Main result row (grouped and single-record searches).
  # Variables: %date% (only for grouped results), %origin-tag%, %leading-tags%,
  # %player% / %source%, %action%, %amount%, %target%, %count% (grouped only),
  # %sign-text% (only for sign-edit) and %time%. Optional spacing is part of
  # each variable's value.
  line = "<gray>= </gray>%date%%origin-tag%%leading-tags%%player% %action%%amount%%target%%count%%time%"

  # Event-specific result-line overrides. %sign-text% joins the non-empty
  # lines from the edited face with spaces.
  event-lines {
    sign-edit = "<gray>= </gray>%date%%origin-tag%%leading-tags%%player% %action%%target% with %sign-text%%time%"
  }

  hover {
    # Multiline MiniMessage template used unless an event-specific template
    # below is configured. Remove or reorder lines to customize the tooltip.
    # %count-line%, %server-line% and %details% are optional multiline blocks.
    default = """<gray>Source: </gray>%source%
<gray>Event: </gray>%event%%count-line%
<gray>Target: </gray>%target%
<gray>When: </gray>%when%
<gray>Origin: </gray>%origin%
<gray>Location: </gray>%location%%server-line%%details%"""

    # Optional complete overrides keyed by the event identifier, e.g.
    # events.command = """<gray>%source% ran %command-line%</gray>
    # %details%"""
    # Variables include %source% / %player%, %event% / %action%, %target%,
    # %when% / %time%, %time-ago%, %origin%, %origin-tag%, %location%,
    # %server%, %amount%, %count%, %recipients%, %command-line%, %ip%,
    # %damage%, %weapon%, %cause%, %via%, %sign-text%, %extensions%, %item-name%,
    # %item-enchants%, %item-tags%, %item-lore%, %count-line%,
    # %server-line% and %details%. Values are safely escaped as text.
    events {}
  }
}
