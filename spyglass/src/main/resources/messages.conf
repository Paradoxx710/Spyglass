# ==============================================================================
#                      Spyglass Messages Configuration
# ==============================================================================
# Config version - do not edit.
config-version = 1
#
# This file allows you to customize and translate all messages and styles in Spyglass.
#
# Syntax Guide:
#   - <tags>        : MiniMessage formatting (colors, gradients, hover, click, fonts).
#                     Examples: <green>, <aqua>, <#ff5555>, <bold>, <italic>,
#                               <hover:show_text:'Click here'><click:run_command:'/sg undo'>
#   - & codes       : Traditional ampersand formatting is also accepted, including
#                     colors (&0-&f), formatting (&l bold, &o italic, &n underline,
#                     &m strike, &k obfuscated, &r reset) and hex (&#ff5555 or
#                     &x&f&f&5&5&5&5). Use && for a literal ampersand.
#                     Both styles can be mixed in the same message.
#   - %placeholder% : Dynamic variables provided by Spyglass or PlaceholderAPI.
#                     Examples: %message%, %player%, %action%, %count%, %time%, %location%
#   - ${prefix}     : Inserts the configured global prefix into this template.
#                     For chat feedback, include it and its separating space in
#                     the template; placeholder values are not space-padded.
# ==============================================================================

# Global prefix available to every message template.
prefix = "<green>«</green><aqua>Spyglass</aqua><green>»</green>"

feedback {
  # Include spacing explicitly in templates; %message% is inserted unchanged.
  # This template also controls the framing of standard catalog errors.
  error = "${prefix} <red>(Error)</red> %message%"
  info = "${prefix} %message%"
  warn = "${prefix} %message%"
  success = "${prefix} %message%"
  bonus = "${prefix} %message%"
  querying = "${prefix} <dark_aqua>Querying records...</dark_aqua>"
  tool-ok = "${prefix} %message%"
  inspect-header = "${prefix} <green>--- </green>%target%<white> at </white>%location%<gray> (last %window%)</gray><green> ---</green>"
}

tool {
  # The inspector wand handed out by /sg tool. Both fields accept
  # MiniMessage tags and traditional & codes.
  name = "<gold><bold>Spyglass Wand</bold></gold>"

  # One line per entry; set to [] for no lore. Examples:
  # lore = ["<gray>Right-click a block to inspect its history.</gray>"]
  # lore = ["&7Right-click a block", "&7to inspect its history."]
  lore = []
}

commands {
  # Generic command feedback
  no-results = "No results."
  config-reloaded = "${prefix} Spyglass configuration reloaded. Event toggles, retention, redaction, wand and time-zone settings are active."
  config-reload-failed = "${prefix} Spyglass could not reload config.conf; check the console."
  config-restart-required = "${prefix} Restart required for %changes%; no live settings were changed."
  no-permission = "<red>You do not have permission to execute this command.</red>"
  player-only = "You must be a player to use this command"
  teleporting = "Teleporting to %location%..."

  # Action-specific permissions
  action-no-permission = "You do not have permission to query the '%action%' action."
  action-rollback-no-permission = "You do not have permission to rollback the '%action%' action."

  # Rollback & Undo
  rollback-queued = "Rollback queued at position %position% (id %id%). View / cancel with /sg rbqueue."
  rollback-started = "Rollback %id% starting before the recorder drained: %detail%. The newest events may be missing from this rollback; re-run once the backlog clears (see /spyglass stats) to catch them."
  rollback-complete = "Rollback complete. Restored %count% blocks in %time%."
  rollback-failed = "Spyglass rollback job %id% failed: %message%"
  undo-complete = "Undo complete. Reverted %id% (%count% blocks restored)."
  no-rollback-in-flight = "No rollback in flight."

  # Tool
  tool-activated = "Added the Spyglass data tool to your inventory."
  tool-deactivated = "Deactivated the Spyglass Data Tool"
  tool-no-room = "Make room in your inventory for the Spyglass wand."

  # Pagination
  page-header = "<green>«</green><aqua>Spyglass</aqua><green>»</green> <gray>(page %page%/%total% - %results% results)</gray>"
  page-invalid = "Invalid page number %page% (total pages: %total%)."
}

help {
  header = "<aqua> -======= Spyglass (%page%/%pages%) =======-</aqua>"
  subtitle = "<dark_gray><italic>For Powerful Searching</italic></dark_gray>"
  entry = "<aqua>/spyglass </aqua><green>%name% %usage%</green><aqua>: </aqua><gray>%description%</gray>"
  nav = "<red>[%arrow%]</red>"
  nav-hover = "<red>Page %page%</red>"
  nav-separator = " "
  commands {
    help = "<aqua>/spyglass </aqua><green>help <Page #></green><aqua>: </aqua><gray>Show this help, one page at a time.</gray>"
    search = "<aqua>/spyglass </aqua><green>search <Lookup Params></green><aqua>: </aqua><gray>Search Data Records based on the parameters provided.</gray>"
    page = "<aqua>/spyglass </aqua><green>page <Page #></green><aqua>: </aqua><gray>Moves you to the specified page of results (cached 15 min).</gray>"
    rollback = "<aqua>/spyglass </aqua><green>rollback <Lookup Params></green><aqua>: </aqua><gray>Rollback a set of changes based on the parameters provided.</gray>"
    restore = "<aqua>/spyglass </aqua><green>restore <Lookup Params></green><aqua>: </aqua><gray>Restore a set of changes based on the parameters provided.</gray>"
    undo = "<aqua>/spyglass </aqua><green>undo</green><aqua>: </aqua><gray>Undo your most recent rollback or restore.</gray>"
    tool = "<aqua>/spyglass </aqua><green>tool</green><aqua>: </aqua><gray>Toggle the inspection wand.</gray>"
    events = "<aqua>/spyglass </aqua><green>events</green><aqua>: </aqua><gray>List every event type currently being recorded.</gray>"
    rbqueue = "<aqua>/spyglass </aqua><green>rbqueue</green><aqua>: </aqua><gray>List, cancel, or resume queued rollback jobs.</gray>"
    inventory = "<aqua>/spyglass </aqua><green>inventory</green><aqua>: </aqua><gray>Open the rollback salvage inventory GUI (in-game only).</gray>"
    stats = "<aqua>/spyglass </aqua><green>stats</green><aqua>: </aqua><gray>Show ingest analytics (when enabled in config).</gray>"
    import = "<aqua>/spyglass </aqua><green>import <file | mysql <source>></green><aqua>: </aqua><gray>Import a CoreProtect database: a SQLite file from plugins/Spyglass/import/, or a live MySQL source from import.conf.</gray>"
    migrate = "<aqua>/spyglass </aqua><green>migrate <backend></green><aqua>: </aqua><gray>Copy all records into another configured storage backend.</gray>"
    version = "<aqua>/spyglass </aqua><green>version</green><aqua>: </aqua><gray>Show version and compatible update status.</gray>"
    reload = "<aqua>/spyglass </aqua><green>reload</green><aqua>: </aqua><gray>Reload live configuration settings (requires spyglass.reload).</gray>"
  }
}

rbqueue {
  usage = "${prefix} <red>(Error)</red> Usage: /sg rbqueue [list | stop | cancel <id> | resume <id>]"
  empty = "${prefix} No rollbacks running, queued, recent, or resumable."
  resumable-header = "<red>» Resumable (interrupted by previous shutdown):</red>"
  resumable-entry = "<red>  %id% (%mode%) by %operator% - query: %query% - started %started%</red>"
  resumable-help = "<gray>  Use /sg rbqueue resume <id> to re-run, /sg rbqueue cancel <id> to discard.</gray>"
  running-header = "<aqua>» Running: %id% (%mode%) by %operator% — %applied% applied, %skipped% skipped, %elapsed%</aqua>"
  query = "<gray>    query: %query%</gray>"
  queued-header = "<yellow>» Queued (%count%):</yellow>"
  pending-entry = "<gray>  %position%. %id% (%mode%) by %operator% — query: %query%</gray>"
  recent-header = "<dark_gray>» Recent:</dark_gray>"
  recent-entry = "<dark_gray>  %id% %state% (%mode%) by %operator% — %applied% applied, %elapsed%</dark_gray>"
  cancel-stopping = "<yellow>Cancel signal sent to %id%. Current chunk will finish, then the rollback stops.</yellow>"
  discarded-resume = "<yellow>Discarded resume entry %id%.</yellow>"
  removed-pending = "<yellow>Removed %id% from queue.</yellow>"
  cancel-inflight = "<yellow>Cancel signal sent to %id% (in flight).</yellow>"
  resuming = "<green>Resuming %id% — re-running query: %query%</green>"
  no-resumable = "${prefix} <red>(Error)</red> No resumable job matching %id%. Use /sg rbqueue list to see resumables."
}

query {
  default-radius-hint = "<dark_gray>(no range; defaulting to %radius% blocks - add r:N or -g for global)</dark_gray>"
}

snapshot {
  chat {
    inventory-full = "${prefix} <yellow>That whole stack won't fit in your inventory - nothing taken.</yellow>"
    no-permission = "${prefix} <red>You don't have permission to take from snapshots.</red>"
    slot-empty = "${prefix} <red>Nothing to take in that slot.</red>"
    expired = "${prefix} <red>That snapshot has expired - re-run /sg snapshot.</red>"
  }
}

updates {
  status-pending = "${prefix} <gray>Update check pending.</gray>"
  status-disabled = "${prefix} <gray>Update checks disabled.</gray>"
  status-available = "${prefix} <yellow>Spyglass %version% is available for Minecraft %minecraft%: %url%</yellow>"
  status-none-compatible = "${prefix} <gray>No compatible published release found for Minecraft %minecraft%.</gray>"
  status-no-newer = "${prefix} <gray>No newer compatible release found for Minecraft %minecraft%.</gray>"
  status-unavailable = "${prefix} <gray>Update check unavailable; see GitHub releases or try again later.</gray>"
  available = "<yellow>Spyglass %version% is available for this Minecraft version. Click to view the release.</yellow>"
}

# Message catalog for command feedback. Placeholders are replaced with runtime
# values and escaped as plain text.
catalog {
  search {
    no-results = "${prefix} <red>(Error)</red> No results."
    no-active-results = "${prefix} No active search results."
    query-failed = "${prefix} <red>(Error)</red> Query failed: %error%"
    no-permission = "${prefix} <red>(Error)</red> You do not have permission to query the '%action%' action."
  }
  rollback {
    no-permission = "${prefix} <red>(Error)</red> You do not have permission to rollback the '%action%' action."
    no-results = "${prefix} <red>(Error)</red> No results."
    queued = "${prefix} Rollback queued at position %position% (id %id%). View / cancel with /sg rbqueue."
    no-in-flight = "${prefix} <red>(Error)</red> No rollback in flight."
    unknown-job = "${prefix} <red>(Error)</red> Unknown job id: %id%. Use /sg rbqueue list to see ids."
    no-matching-job = "${prefix} <red>(Error)</red> No matching pending or in-flight job."
  }
  undo {
    no-actions = "${prefix} <red>(Error)</red> You have no valid actions to undo"
    player-only = "${prefix} <red>(Error)</red> You must be a player to use this command"
    lookup-failed = "${prefix} <red>(Error)</red> Undo lookup failed: %error%"
    failed = "${prefix} <red>(Error)</red> Undo failed: %error%"
    salvage-warning = "${prefix} Salvage entries for the undone rollback could not be withdrawn; /sg inventory may still list them."
  }
  import {
    running = "${prefix} <red>(Error)</red> An import is already running; try again once it finishes."
    failed = "${prefix} <red>(Error)</red> Import failed: %error%"
    complete = "${prefix} Import complete for %name%: read=%read% written=%written% skipped=%skipped%"
    reimport-mongo = "${prefix} <red>(Error)</red> This source was already imported and re-importing into MongoDB is not supported; switch backends or restore from a MongoDB backup."
    confirm-reimport = "${prefix} <red>(Error)</red> This source was already imported on %time% by %operator% (read=%read%, written=%written%, skipped=%skipped%). Re-run with --confirm to import again."
  }
  migrate {
    running = "${prefix} <red>(Error)</red> A migration is already running; try again once it finishes."
    failed = "${prefix} <red>(Error)</red> Migration failed: %error%"
    unknown-backend = "${prefix} <red>(Error)</red> Unknown backend '%backend%' (expected sqlite, mongo, clickhouse, or mariadb)."
    active-backend = "${prefix} <red>(Error)</red> %backend% is already the active backend; nothing to migrate."
    import-running = "${prefix} <red>(Error)</red> A CoreProtect import is running; wait for it before migrating."
  }
  teleport {
    world-not-found = "${prefix} <red>(Error)</red> World not found: %world%"
    invalid-coordinates = "${prefix} <red>(Error)</red> Invalid teleport coordinates."
    out-of-range = "${prefix} <red>(Error)</red> Teleport coordinates out of range."
  }
  snapshot {
    unknown-player = "${prefix} <red>(Error)</red> Unknown player: %player%"
    lookup-failed = "${prefix} <red>(Error)</red> Snapshot lookup failed - see the console."
    no-snapshot = "${prefix} <red>(Error)</red> No snapshot for %player% at or before %time%."
    reconstruction-failed = "${prefix} <red>(Error)</red> Snapshot reconstruction failed - see the console."
    unknown-world = "${prefix} <red>(Error)</red> Unknown world: %world%"
    not-container = "${prefix} <red>(Error)</red> Not a container: %material%"
    not-container-history = "${prefix} <red>(Error)</red> Not a container, and no container history at %target%."
    outside-world-border = "${prefix} <red>(Error)</red> trg: is outside the world border."
    container-never-existed = "${prefix} <red>(Error)</red> No container has ever existed at %location% - that chunk has never been generated."
    container-needs-target = "${prefix} <red>(Error)</red> Container snapshot needs a player (to look at a block), or trg:x,y,z."
    no-block-in-reach = "${prefix} <red>(Error)</red> No block in reach - look at a container, or use trg:x,y,z."
    console-needs-world = "${prefix} <red>(Error)</red> trg: needs w: when run from the console."
    player-snapshots-disabled = "${prefix} <red>(Error)</red> Player inventory snapshots are turned off."
    enable-player-snapshots = "${prefix} Set snapshot.players.enabled = true in config.conf and restart to start recording them."
    container-snapshots-no-setting = "${prefix} Container snapshots need no setting: look at a container, or use trg:x,y,z."
    player-only = "${prefix} <red>(Error)</red> Open snapshots in-game as a player."
    gui-unavailable = "${prefix} <red>(Error)</red> The snapshot GUI is unavailable. Contact an administrator."
    open-failed = "${prefix} <red>(Error)</red> Could not open the snapshot GUI. Contact an administrator."
  }
  tool {
    no-room = "${prefix} <red>(Error)</red> Make room in your inventory for the Spyglass wand."
    added = "${prefix} Added the Spyglass data tool to your inventory."
    activated = "${prefix} <green>Activated the Spyglass Data Tool</green> <gray>(%material%)</gray>"
    deactivated = "${prefix} Deactivated the Spyglass Data Tool"
  }
  salvage {
    no-inventories = "${prefix} <red>(Error)</red> No salvaged inventories."
    inventory-full = "${prefix} <red>(Error)</red> Your inventory is full."
    player-only = "${prefix} <red>(Error)</red> Open rollback salvage in-game as a player."
    disabled = "${prefix} <red>(Error)</red> Container salvage is not enabled on this backend."
    unavailable = "${prefix} <red>(Error)</red> The rollback salvage GUI is unavailable. Contact an administrator."
    open-failed = "${prefix} <red>(Error)</red> Could not open the rollback salvage GUI. Contact an administrator."
  }
}

results {
  # Display tokens
  ip-hidden = "(ip hidden)"

  # Main result row (grouped and single-record searches).
  # Variables: %date% (only for grouped results), %origin-tag%, %leading-tags%,
  # %player% / %source%, %action%, %amount%, %target%, %count% (grouped only),
  # %sign-text% (only for sign-edit) and %time%. Values contain no styling
  # or padding; spacing and colors are controlled by these templates.
  line = "<gray>= </gray><gray>%date%</gray> <aqua>%origin-tag%</aqua> %leading-tags% <green>%player%</green> <white>%action%</white> <green>%amount%</green> <aqua>%target%</aqua> <green>%count%</green> <white>%time%</white>"

  # Event-specific result-line overrides. %sign-text% joins the non-empty
  # lines from the edited face with spaces.
  event-lines {
    sign-edit = "<gray>= </gray><gray>%date%</gray> <aqua>%origin-tag%</aqua> %leading-tags% <green>%player%</green> <white>%action%</white> <aqua>%target%</aqua> with %sign-text% <white>%time%</white>"
  }

  hover {
    # Multiline MiniMessage template used unless an event-specific template
    # below is configured. Remove or reorder lines to customize the tooltip.
    # %count-line%, %server-line% and %details% are optional multiline blocks.
    default = """<gray>Source: </gray>%source%
<gray>Event: </gray>%event%%count-line%
<gray>Target: </gray>%target%
<gray>When: </gray>%when%
<gray>Origin: </gray>%origin%
<gray>Location: </gray>%location%%server-line%%details%"""

    # Optional complete overrides keyed by the event identifier, e.g.
    # events.command = """<gray>%source% ran %command-line%</gray>
    # %details%"""
    # Variables include %source% / %player%, %event% / %action%, %target%,
    # %when% / %time%, %time-ago%, %origin%, %origin-tag%, %location%,
    # %server%, %amount%, %count%, %recipients%, %command-line%, %ip%,
    # %damage%, %weapon%, %cause%, %via%, %sign-text%, %extensions%, %item-name%,
    # %item-enchants%, %item-tags%, %item-lore%, %count-line%,
    # %server-line% and %details%. Values are safely escaped as text.
    events {}
  }
}

time {
  just-now = "just now"
  seconds = "%ss"
  minutes = "%sm"
  hours = "%sh"
  days = "%sd"
  weeks = "%sw"
}
